<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - C.A.D.C.C</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, rgba(197, 160, 89, 0.18), transparent 50%), linear-gradient(135deg, #090909 0%, #181818 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .login-box {
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-top: 4px solid #c5a059;
            border-radius: 16px;
            padding: 40px 35px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .logo-login {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin: 0 auto 15px;
            display: block;
            filter: drop-shadow(0 5px 18px rgba(197, 160, 89, 0.4));
            transition: transform 0.3s ease;
        }

            .logo-login:hover {
                transform: scale(1.06);
            }

        .shield-badge {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #c5a059 0%, #8a6a2c 100%);
            color: #111;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 auto 15px;
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.35);
        }

        .login-box h2 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .login-box p.sub {
            color: #c5a059;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

            .input-group label {
                display: block;
                font-size: 0.75rem;
                font-weight: 800;
                color: #aaa;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 8px;
            }

            .input-group input {
                width: 100%;
                padding: 13px 15px;
                background: #111;
                border: 1px solid #333;
                border-radius: 8px;
                color: #fff;
                font-size: 1rem;
                font-weight: 600;
                transition: 0.3s;
            }

                .input-group input:focus {
                    outline: none;
                    border-color: #c5a059;
                    box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
                }

        /* ESTILOS DEL CAPTCHA */
        .captcha-container {
            background: #111;
            border: 1px solid #2e2e2e;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: left;
        }

        .captcha-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

            .captcha-header span {
                font-size: 0.72rem;
                font-weight: 800;
                color: #c5a059;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

        .btn-refresh {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-refresh:hover {
                border-color: #c5a059;
                color: #c5a059;
            }

        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #captchaCanvas {
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a1a;
            flex-shrink: 0;
        }

        .captcha-input {
            width: 100%;
            padding: 11px 12px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

            .captcha-input:focus {
                outline: none;
                border-color: #c5a059;
            }

        .btn-ingresar {
            width: 100%;
            background: linear-gradient(90deg, #c5a059 0%, #e0be77 100%);
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

            .btn-ingresar:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(197, 160, 89, 0.35);
            }

        .error-msg {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid #dc3545;
            color: #ff6b7a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-top: 15px;
            display: none;
        }

        .volver-link {
            display: inline-block;
            margin-top: 22px;
            color: #888;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: 0.2s;
        }

            .volver-link:hover {
                color: #c5a059;
            }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="image.png" alt="Escudo CADCC" class="logo-login" onerror="this.style.display='none'; document.getElementById('escudoRespaldo').style.display='flex';">
        <div id="escudoRespaldo" class="shield-badge">CC</div>
        <h2>Portal de Acceso</h2>
        <p class="sub">Defensores Central Córdoba</p>

        <form onsubmit="iniciarSesion(event)">
            <div class="input-group">
                <label>Número de DNI (Sin puntos)</label>
                <input type="number" id="dniInput" placeholder="Ej: 22222222" required>
            </div>

            <!-- BLOQUE CAPTCHA -->
            <div class="captcha-container">
                <div class="captcha-header">
                    <span>🛡️ Verificación de Seguridad</span>
                    <button type="button" class="btn-refresh" onclick="generarCaptcha()">🔄 Nuevo</button>
                </div>
                <div class="captcha-row">
                    <canvas id="captchaCanvas" width="145" height="44"></canvas>
                    <input type="text" id="captchaInput" class="captcha-input" placeholder="CÓDIGO" maxlength="5" required>
                </div>
            </div>

            <button type="submit" class="btn-ingresar">Ingresar al Sistema</button>
            <div id="mensajeError" class="error-msg"></div>
        </form>

        <a href="index.html" class="volver-link">⬅ Volver a la Página Oficial</a>
    </div>

    <script>
        let codigoCaptchaActual = '';

        function generarCaptcha() {
            const caracteres = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            codigoCaptchaActual = '';
            for (let i = 0; i < 5; i++) {
                codigoCaptchaActual += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }

            const canvas = document.getElementById('captchaCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo oscuro texturizado
            ctx.fillStyle = '#141414';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Líneas de interferencia doradas y grises
            for (let i = 0; i < 6; i++) {
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(197, 160, 89, 0.45)' : 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }

            // Dibujar letras con rotación leve
            ctx.font = '900 22px Montserrat, sans-serif';
            ctx.fillStyle = '#c5a059';
            for (let i = 0; i < codigoCaptchaActual.length; i++) {
                ctx.save();
                const x = 18 + i * 24;
                const y = 29 + (Math.random() * 6 - 3);
                const angulo = (Math.random() - 0.5) * 0.35;
                ctx.translate(x, y);
                ctx.rotate(angulo);
                ctx.fillText(codigoCaptchaActual[i], 0, 0);
                ctx.restore();
            }

            document.getElementById('captchaInput').value = '';
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const dni = document.getElementById('dniInput').value.trim();
            const captchaUsuario = document.getElementById('captchaInput').value.trim().toUpperCase();
            const cajaError = document.getElementById('mensajeError');
            cajaError.style.display = 'none';

            // 1. Validar CAPTCHA primero
            if (captchaUsuario !== codigoCaptchaActual) {
                cajaError.innerText = '❌ El código CAPTCHA ingresado es incorrecto.';
                cajaError.style.display = 'block';
                generarCaptcha();
                return;
            }

            // 2. Validar DNI contra la API en C#
            try {
                const response = await fetch('https://localhost:7295/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dni: dni })
                });

                if (response.ok) {
                    const usuario = await response.json();
                    localStorage.setItem('usuarioClub', JSON.stringify(usuario));
                    window.location.href = 'panel.html';
                } else {
                    const errorData = await response.json();
                    cajaError.innerText = errorData.mensaje || 'DNI no registrado en el club.';
                    cajaError.style.display = 'block';
                    generarCaptcha();
                }
            } catch (error) {
                cajaError.innerText = 'Error al conectar con el servidor (Puerto 7295).';
                cajaError.style.display = 'block';
            }
        }

        // Generar primer captcha al abrir la pantalla
        generarCaptcha();
    </script>

</body>
</html>
